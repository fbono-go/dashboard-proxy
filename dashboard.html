<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Mantenimiento — Grupo Oroño</title>
<style>
/* =========================================================================
   TOKENS DE COLOR (adaptables claro/oscuro)
   Nada hardcodeado: todo componente lee de estas variables.
   ========================================================================= */
:root{
  --surface-0:#eef1f6;   /* fondo de página */
  --surface-1:#ffffff;   /* paneles */
  --surface-1-top:#ffffff;
  --surface-2:#eceff4;   /* anidados / tracks */
  --surface-2-top:#f4f6fa;
  --border:#dbe1ea;
  --border-soft:rgba(20,30,50,.06);
  --text:#151b26;
  --text-secondary:#4a5568;
  --text-muted:#8a94a3;
  --zone-red:#e5352f;
  --zone-amber:#f2900a;
  --zone-green:#1ea34a;
  --gauge-track:#e1e6ee;
  --accent:#1976d2;
  --accent-2:#4aa3ff;
  --shadow:0 1px 2px rgba(20,30,55,.04),0 6px 18px -6px rgba(20,30,55,.10);
  --shadow-lg:0 2px 4px rgba(20,30,55,.05),0 16px 40px -12px rgba(20,30,55,.16);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.7);
  --highlight:rgba(255,255,255,.55);
  --stale:#d99515;       /* indicador de dato viejo */
  /* Preventivo: mismos colores que la app y el panel */
  --pv-rojo:#e5352f; --pv-naranja:#ef5a1f; --pv-amarillo:#f5ac0a; --pv-verde:#1ea34a; --pv-gris:#adb7c4;
}
[data-theme="dark"]{
  --surface-0:#090d13;
  --surface-1:#141a24;
  --surface-1-top:#1a212d;
  --surface-2:#1b2230;
  --surface-2-top:#212938;
  --border:#262f3d;
  --border-soft:rgba(255,255,255,.06);
  --text:#eef2f7;
  --text-secondary:#9aa7b6;
  --text-muted:#68758a;
  --zone-red:#f1554e;
  --zone-amber:#f7ab35;
  --zone-green:#3fc06a;
  --gauge-track:#242c3a;
  --accent:#5aa9ff;
  --accent-2:#7cc0ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.55);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 24px 56px -18px rgba(0,0,0,.7);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.045);
  --highlight:rgba(255,255,255,.05);
  --stale:#f2c14e;
  --pv-rojo:#f1554e; --pv-naranja:#ff7f3f; --pv-amarillo:#f7c948; --pv-verde:#3fc06a; --pv-gris:#4b5568;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:
    radial-gradient(ellipse 90% 60% at 15% -10%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 60%),
    radial-gradient(ellipse 70% 50% at 100% 105%, color-mix(in srgb, var(--accent) 5%, transparent), transparent 60%),
    var(--surface-0);
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}

/* =========================================================================
   LAYOUT 16:9 — llena todo el viewport (en la TV 4K kiosk = pantalla completa)
   ========================================================================= */
#dash{
  width:100vw;height:100vh;
  padding:.5vw;
  display:flex;flex-direction:column;gap:.4vw;
}

/* ---- Header (barra slim: reloj izq · clima der) ---- */
#header{display:flex;flex:0 0 5.8%;}
.panel{
  background:linear-gradient(180deg,var(--surface-1-top),var(--surface-1));
  border:1px solid var(--border-soft);
  border-radius:.85vw;
  box-shadow:var(--shadow),var(--shadow-inset);
  position:relative;
}
#topbar{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 1.4vw;position:relative;}
/* El reloj es además la puerta de entrada al ajuste oculto (7 clics).
   Sin cursor:pointer ni hover: nada debe delatar que es clickeable.
   user-select:none evita que al clickear rápido se subraye/seleccione el texto. */
#clock{font-size:2.3vw;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,var(--text),color-mix(in srgb,var(--text) 78%,var(--text-secondary)));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
#weather-inline{display:flex;align-items:center;gap:.9vw;}
#weather-inline .wx-icon{font-size:2vw;line-height:1;filter:drop-shadow(0 2px 4px rgba(20,30,55,.15));}
#weather-inline .wx-temp{font-size:2vw;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
#weather-inline .wx-cond{font-size:.95vw;color:var(--text-secondary);max-width:16vw;}
.storm-alert{
  background:linear-gradient(180deg,color-mix(in srgb,var(--zone-amber) 96%,white 8%),var(--zone-amber));
  color:#1a1400;
  font-size:.8vw;font-weight:700;
  padding:.25vw .6vw;border-radius:.5vw;margin-right:.4vw;
  box-shadow:0 2px 8px -2px color-mix(in srgb,var(--zone-amber) 55%,transparent);
  display:none;align-items:center;gap:.3vw;
}
.storm-alert.on{display:flex;align-items:center;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ---- Cuerpo ---- */
#body{flex:1;display:flex;gap:.4vw;min-height:0;}
#calendar{flex:1;min-width:0;display:flex;flex-direction:row;overflow:hidden;}
/* Columna derecha: Tareas arriba, Preventivo abajo */
#side{flex:0 0 24%;display:flex;flex-direction:column;gap:.4vw;min-width:0;min-height:0;}
#tasks{flex:1;min-height:0;display:flex;flex-direction:row;overflow:hidden;}
#prev{flex:0 0 auto;max-height:52%;display:flex;flex-direction:row;overflow:hidden;}
/* Título vertical sobre el borde izquierdo (no gasta altura) */
.v-title{
  flex:0 0 2.2vw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:.9vw 0;background:linear-gradient(180deg,var(--surface-2-top),var(--surface-2));
  border-right:1px solid var(--border-soft);
  border-radius:.85vw 0 0 .85vw;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.02);
}
.v-title .vt-text{writing-mode:vertical-rl;transform:rotate(180deg);font-size:1.15vw;font-weight:700;letter-spacing:.08em;white-space:nowrap;color:var(--text-secondary);}
.v-title .fresh{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.62vw;font-weight:500;color:var(--text-muted);white-space:nowrap;}
.v-title .fresh.stale{color:var(--stale);}

/* Calendario: gutter de horas + 4 columnas de día */
#cal-grid{flex:1;min-width:0;display:grid;grid-template-columns:2.6vw repeat(4,1fr);overflow:hidden;}
.day-col{border-left:1px solid var(--border-soft);position:relative;overflow:hidden;}
.day-col:first-of-type{border-left:none;}
.day-name{
  position:absolute;top:0;left:0;right:0;height:2vw;z-index:5;
  background:linear-gradient(180deg,var(--surface-2-top),var(--surface-2));
  border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:.9vw;font-weight:600;gap:.4vw;
  color:var(--text-secondary);
}
.day-name.today{color:var(--accent);font-weight:800;letter-spacing:.05em;}
.day-name.today::after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.day-name .dot{width:.5vw;height:.5vw;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent);}
/* Línea roja de la hora actual (como Google Calendar) */
.now-line{position:absolute;left:0;right:0;height:0;border-top:2px solid #ea4335;z-index:6;pointer-events:none;
  filter:drop-shadow(0 0 4px rgba(234,67,53,.5));}
.now-line .now-dot{position:absolute;left:0;top:50%;width:.6vw;height:.6vw;border-radius:50%;background:#ea4335;
  transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(234,67,53,.18),0 1px 3px rgba(0,0,0,.3);}
.hour-gutter{position:relative;}
.gutter-body{position:absolute;top:2vw;left:0;right:0;bottom:0;}
.hour-label{
  position:absolute;right:.3vw;font-size:.66vw;color:var(--text-muted);
  transform:translateY(-50%);font-variant-numeric:tabular-nums;
}
.hour-line{position:absolute;left:0;right:0;border-top:1px solid var(--border);opacity:.4;}
.events-area{position:absolute;top:2vw;left:0;right:0;bottom:0;}
.event{
  position:absolute;left:3%;right:3%;
  border-radius:.4vw;padding:.18vw .45vw;overflow:hidden;
  font-size:.72vw;line-height:1.2;color:#fff;
  background-image:linear-gradient(165deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);
  background-blend-mode:overlay;
  box-shadow:0 2px 6px -2px rgba(10,15,30,.35),inset 0 1px 0 rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.08);
  display:flex;align-items:flex-start;gap:.3vw;
}
.event .ev-time{font-weight:700;opacity:.95;white-space:nowrap;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.25);}
.event .ev-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-shadow:0 1px 2px rgba(0,0,0,.2);}

/* Evento a <=15 min de empezar: borde + glow pulsante en el color propio del
   evento (--ev-color), y un punto parpadeante junto al título. Se nota a
   distancia en la TV sin competir con el fuego de tareas (paleta distinta,
   ritmo más lento y sereno: esto es un aviso, no una urgencia vencida). */
.event.soon-alert{
  border:1.5px solid color-mix(in srgb, var(--ev-color) 55%, white 45%);
  animation:evt-pulse 1.8s ease-in-out infinite;
  z-index:2;
}
.event.soon-alert .ev-soon-badge{
  color:#fff;font-size:.5vw;line-height:1;flex-shrink:0;margin-left:auto;
  animation:evt-dot 1.8s ease-in-out infinite;
  text-shadow:0 0 4px rgba(255,255,255,.9);
}
@keyframes evt-pulse{
  0%,100%{
    box-shadow:0 2px 6px -2px rgba(10,15,30,.35),
               inset 0 1px 0 rgba(255,255,255,.18),
               0 0 0 0 color-mix(in srgb, var(--ev-color) 65%, transparent);
  }
  50%{
    box-shadow:0 2px 10px -1px rgba(10,15,30,.4),
               inset 0 1px 0 rgba(255,255,255,.25),
               0 0 0 5px color-mix(in srgb, var(--ev-color) 0%, transparent),
               0 0 14px 3px color-mix(in srgb, var(--ev-color) 75%, transparent);
  }
}
@keyframes evt-dot{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* Tareas (Google Tasks) */
#task-list{flex:1;min-width:0;overflow:hidden;padding:.7vw;display:flex;flex-direction:column;gap:.55vw;}
.task{
  background:linear-gradient(180deg,var(--surface-2-top),var(--surface-2));
  border:1px solid var(--border-soft);
  border-radius:.6vw;padding:.55vw .7vw;position:relative;overflow:hidden;
  flex:0 0 auto;
  box-shadow:0 1px 2px rgba(20,30,55,.05);
  transition:box-shadow .25s;
}
.task .t-title{font-size:.92vw;font-weight:600;position:relative;z-index:3;}
.task .t-due{font-size:.74vw;color:var(--text-secondary);margin-top:.15vw;position:relative;z-index:3;font-weight:500;}
/* estados */
.task.soon{border-left:.3vw solid var(--text-muted);}
.task.overdue{border-left:.3vw solid var(--zone-red);background:linear-gradient(180deg,color-mix(in srgb,var(--zone-red) 7%,var(--surface-2-top)),var(--surface-2));}
.task.overdue .t-due{color:var(--zone-red);font-weight:700;}
.task.done{opacity:.55;}
.task.done .t-title{text-decoration:line-through;color:var(--zone-green);}
/* vence hoy = ardiendo */
.task.fire{background:linear-gradient(180deg,#241813 0%,#1e0e05 45%,#160600 100%);
  border:1px solid #ff7a1a;animation:fire-glow 2.6s ease-in-out infinite;
  box-shadow:0 4px 14px -4px rgba(255,107,0,.35);}
.task.fire .t-title{color:#FFE6B3;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.7);font-weight:700;position:relative;z-index:3;}
.task.fire .t-due{color:#FFB040;text-shadow:0 1px 3px rgba(0,0,0,.9);position:relative;z-index:3;}
.task.fire canvas{
  position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;z-index:1;
  pointer-events:none;mix-blend-mode:screen;
  filter:blur(2.2px) saturate(1.2) brightness(1.05);
  image-rendering:auto;
  will-change:filter;
}
/* Halo cálido detrás del canvas: ancla la llama a un resplandor de base,
   en vez de que el humo/fuego "flote" solo sobre el fondo oscuro. */
.task.fire::before{
  content:'';position:absolute;left:6%;right:6%;bottom:-20%;height:70%;z-index:0;
  background:radial-gradient(ellipse at 50% 100%, rgba(255,140,20,.55), rgba(255,90,0,.18) 55%, transparent 75%);
  filter:blur(6px);pointer-events:none;
  animation:ember-pulse 1.8s ease-in-out infinite;
}
@keyframes ember-pulse{0%,100%{opacity:.75;transform:scaleX(1)}50%{opacity:1;transform:scaleX(1.06)}}
@keyframes fire-glow{
  0%,100%{box-shadow:0 0 8px 2px #ff6b0077, inset 0 0 12px #ff4d0033, 0 4px 14px -4px rgba(255,107,0,.35);}
  50%{box-shadow:0 0 16px 5px #ff8c00aa, inset 0 0 20px #ff4d0055, 0 4px 18px -2px rgba(255,140,0,.5);}
}
.more-tag{font-size:.78vw;color:var(--text-muted);text-align:center;padding:.3vw;}
/* Rueda de tareas: si no entran todas, suben en forma continua y la lista se
   repite por detrás, sin corte. El degradé hace que aparezcan y se vayan suave. */
.task-track{display:flex;flex-direction:column;gap:.55vw;}
#task-list.rueda{
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);}
#task-list.rueda .task-track{animation:rueda-tareas linear infinite;will-change:transform;}
@keyframes rueda-tareas{from{transform:translateY(0);}to{transform:translateY(calc(-1 * var(--dist)));}}

/* Preventivo: una barra por proveedor (vencido · 7 d · 14 d · al día · sin preventivo) */
#prev-list{flex:1;min-width:0;padding:.7vw;display:flex;flex-direction:column;gap:.75vw;overflow:hidden;}
.pv-row{display:flex;flex-direction:column;gap:.32vw;}
.pv-top{display:flex;justify-content:space-between;align-items:baseline;gap:.5vw;}
.pv-nom{font-size:.95vw;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pv-venc{font-size:.7vw;color:var(--text-muted);white-space:nowrap;}
.pv-venc b{font-size:1.25vw;font-weight:800;color:var(--zone-green);font-variant-numeric:tabular-nums;margin-right:.25vw;}
.pv-venc.mal b{color:var(--zone-red);}
.pv-bar{display:flex;height:1.35vw;border-radius:.45vw;overflow:hidden;background:var(--gauge-track);
  gap:2px;box-shadow:inset 0 1px 2px rgba(20,30,55,.08);padding:2px;}
.pv-bar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.68vw;font-weight:800;
  color:#10141a;min-width:0;overflow:hidden;font-variant-numeric:tabular-nums;border-radius:.2vw;
  background-image:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%,rgba(0,0,0,.06));
  background-blend-mode:overlay;}
.pv-bar i.gris{color:var(--text);}
.pv-sub{font-size:.68vw;color:var(--text-secondary);}
.pv-leyenda{display:flex;flex-wrap:wrap;gap:.25vw .6vw;font-size:.6vw;color:var(--text-muted);margin-top:auto;}
.pv-leyenda span{display:flex;align-items:center;gap:.25vw;}
.pv-leyenda i{width:.55vw;height:.55vw;border-radius:.15vw;display:inline-block;box-shadow:0 1px 2px rgba(20,30,55,.15);}
.pv-vacio{font-size:.8vw;color:var(--text-muted);text-align:center;padding:.6vw;}
/* Modo compacto (más de 3 proveedores): nombre · barra · vencidos en una línea */
#prev-list.compacto{gap:.45vw;}
#prev-list.compacto .pv-row{display:grid;grid-template-columns:28% 1fr auto;align-items:center;gap:.45vw;}
#prev-list.compacto .pv-top{display:contents;}
#prev-list.compacto .pv-nom{grid-column:1;grid-row:1;font-size:.8vw;}
#prev-list.compacto .pv-bar{grid-column:2;grid-row:1;height:1.05vw;}
#prev-list.compacto .pv-venc{grid-column:3;grid-row:1;}
#prev-list.compacto .pv-venc b{font-size:1vw;}
#prev-list.compacto .pv-sub{display:none;}
.pv-mas{font-size:.7vw;color:var(--text-muted);text-align:center;}

/* ---- Franja de gauges ---- */
#gauges{
  flex:0 0 auto;
  background:linear-gradient(180deg,var(--surface-1-top),var(--surface-1));
  border:1px solid var(--border-soft);
  border-radius:.85vw;box-shadow:var(--shadow),var(--shadow-inset);
  padding:.35vw .6vw;
  display:flex;gap:.5vw;align-items:center;
}
.gauge-card{
  flex:1;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05vw;
  padding:.15vw 0;border-radius:.5vw;
  position:relative;
}
.gauge-card:not(:last-child)::after{
  content:'';position:absolute;right:calc(-.25vw - .5px);top:12%;bottom:12%;width:1px;
  background:linear-gradient(180deg,transparent,var(--border-soft) 30%,var(--border-soft) 70%,transparent);
}
.gauge-wrap{position:relative;width:100%;max-width:8vw;filter:drop-shadow(0 2px 5px rgba(20,30,55,.08));}
.gauge-svg{width:100%;height:auto;display:block;}
.gauge-value{
  position:absolute;top:52%;left:0;right:0;transform:translateY(-50%);
  text-align:center;font-size:1.9vw;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.gauge-name{font-size:.88vw;font-weight:600;text-align:center;line-height:1.05;color:var(--text-secondary);}
.gauge-name small{font-size:.7vw;line-height:1;}
.gauge-badge{
  font-size:.68vw;font-weight:700;padding:.14vw .55vw;border-radius:.4vw;
  display:flex;align-items:center;gap:.3vw;
  border:1px solid transparent;
}
.gauge-badge.zero{background:color-mix(in srgb,var(--zone-green) 14%,transparent);color:var(--zone-green);
  border-color:color-mix(in srgb,var(--zone-green) 28%,transparent);}
.gauge-badge.some{background:color-mix(in srgb,var(--zone-red) 14%,transparent);color:var(--zone-red);
  border-color:color-mix(in srgb,var(--zone-red) 28%,transparent);}

/* Controles integrados en la franja de gauges (ya no flotan sobre el contenido) */
#controls-inner{display:flex;flex-direction:column;gap:.3vw;align-items:center;justify-content:center;padding:0 .3vw;}
.ctl-btn{
  background:linear-gradient(180deg,var(--surface-2-top),var(--surface-2));border:1px solid var(--border);color:var(--text-secondary);
  border-radius:.45vw;padding:.3vw .6vw;font-size:.75vw;cursor:pointer;white-space:nowrap;
  box-shadow:0 1px 2px rgba(20,30,55,.06);transition:color .15s,border-color .15s,transform .15s;
}
.ctl-btn:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px);}
.ctl-btn:active{transform:translateY(0);}

/* ---- Barra de estado ---- */
#statusbar{
  position:fixed;bottom:.4vw;left:.6vw;
  display:flex;align-items:center;gap:.5vw;
  font-size:.68vw;color:var(--text-muted);z-index:50;
}
.dot-status{width:.55vw;height:.55vw;border-radius:50%;background:var(--zone-green);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--zone-green) 20%,transparent);}
.dot-status.warn{background:var(--stale);box-shadow:0 0 0 3px color-mix(in srgb,var(--stale) 20%,transparent);}
.dot-status.err{background:var(--zone-red);box-shadow:0 0 0 3px color-mix(in srgb,var(--zone-red) 20%,transparent);}

/* =========================================================================
   AJUSTE OCULTO DE TICKETS — overlay que solo aparece con el gesto secreto.
   No hay ningún botón ni pista visual hacia acá en el dashboard.
   ========================================================================= */
#adj-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.74);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;
}
#adj-overlay.on{display:flex;animation:fade-in .2s ease-out;}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
#adj-modal{
  background:linear-gradient(180deg,var(--surface-1-top),var(--surface-1));
  border:1px solid var(--border-soft);
  border-radius:1vw;box-shadow:0 .8vw 3vw rgba(0,0,0,.55),var(--shadow-inset);
  width:52vw;max-height:84vh;overflow:auto;padding:1.5vw 1.8vw;
  animation:pop-in .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop-in{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
#adj-modal h2{font-size:1.35vw;font-weight:700;margin-bottom:.25vw;}
#adj-modal .adj-sub{font-size:.8vw;color:var(--text-secondary);margin-bottom:1.1vw;}
.adj-head,.adj-row{
  display:grid;grid-template-columns:1fr 5vw 11vw 5vw;
  align-items:center;gap:.8vw;padding:.45vw .2vw;
}
.adj-head{
  font-size:.72vw;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);border-bottom:1px solid var(--border);padding-bottom:.5vw;
}
.adj-row{border-bottom:1px solid var(--border);}
.adj-row:last-of-type{border-bottom:none;}
.adj-name{font-size:1vw;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.adj-real,.adj-shown{font-size:1.1vw;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;}
.adj-real{color:var(--text-secondary);}
.adj-shown{color:var(--accent);}
.adj-shown.changed{color:var(--zone-amber);}
.adj-ctl{display:flex;align-items:center;gap:.3vw;justify-content:center;}
.adj-ctl button{
  background:linear-gradient(180deg,var(--surface-2-top),var(--surface-2));border:1px solid var(--border);color:var(--text);
  border-radius:.4vw;width:2vw;height:1.9vw;font-size:.95vw;font-weight:700;cursor:pointer;
  line-height:1;flex:0 0 auto;transition:border-color .15s,color .15s,transform .1s;
}
.adj-ctl button:hover{border-color:var(--accent);color:var(--accent);}
.adj-ctl button:active{transform:scale(.93);}
.adj-ctl input{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:.4vw;width:4vw;height:1.9vw;text-align:center;
  font-size:1vw;font-weight:700;font-variant-numeric:tabular-nums;
  font-family:inherit;-moz-appearance:textfield;
  box-shadow:inset 0 1px 2px rgba(20,30,55,.08);
  transition:border-color .15s;
}
.adj-ctl input::-webkit-outer-spin-button,
.adj-ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.adj-ctl input:focus{outline:none;border-color:var(--accent);}
#adj-foot{display:flex;align-items:center;gap:.6vw;margin-top:1.3vw;}
#adj-foot .spacer{flex:1;}
.adj-btn{
  background:linear-gradient(180deg,var(--surface-2-top),var(--surface-2));border:1px solid var(--border);color:var(--text-secondary);
  border-radius:.45vw;padding:.5vw 1.1vw;font-size:.85vw;font-weight:600;cursor:pointer;
  font-family:inherit;transition:color .15s,border-color .15s,transform .1s;
}
.adj-btn:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px);}
.adj-btn:active{transform:translateY(0);}
.adj-btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));border-color:var(--accent);color:#fff;
  box-shadow:0 3px 10px -3px color-mix(in srgb,var(--accent) 55%,transparent);}
.adj-btn.primary:hover{opacity:.92;color:#fff;}
.adj-btn.danger:hover{border-color:var(--zone-red);color:var(--zone-red);}
#adj-msg{font-size:.8vw;color:var(--zone-green);font-weight:600;opacity:0;transition:opacity .25s;}
#adj-msg.on{opacity:1;}
.adj-empty{font-size:.95vw;color:var(--text-secondary);padding:1.5vw 0;text-align:center;}
</style>

<script>
/* =========================================================================
   CONFIG — todo lo ajustable en un solo lugar.
   En la fase funcional, buena parte de esto viene de /config del proxy.
   ========================================================================= */
const CONFIG = {
  // 'mock' = todo con datos de ejemplo (funciona sin conexión).
  // 'real' = usa el proxy para las fuentes marcadas en `live` de abajo.
  mode:'real',
  // Autodetecta: si el dashboard se sirve desde el proxy (http/https) usa el mismo
  // origen; si se abre como archivo local, cae a la URL absoluta del proxy.
  proxyBase: (location.protocol==='file:') ? 'https://dashboard-proxy-rx5w.onrender.com' : location.origin,
  // Referente de este dashboard (sale de la URL ?ref=321). El proxy usa su perfil.
  ref: new URLSearchParams(location.search).get('ref') || '',
  // Qué fuentes ya tienen endpoint real.
  live:{ tickets:true, derivar:true, calendar:false, tasks:false, weather:false, preventivo:true },
  // Selección que hoy está fija acá; en la fase /config sale de la pantalla + localStorage.
  selection:{
    oficiales:[67,66,68,64,65],  // owner_id de los oficiales a mostrar
    institucionOrg:13,           // institución del gauge "Tickets totales" (13 = ICR)
    derivarRef:321,              // referente del gauge "A derivar" (321 = Franco Bono)
    derivarOrg:13,               // institución del gauge "A derivar"
    days:30
  },
  fetchTimeoutMs:15000,                         // corta promesas colgadas (arranque en frío de Render)
  // Intervalos de refresco escalonados por fuente (ms)
  intervals:{ tickets:120000, derivar:120000, tasks:180000, calendar:600000, weather:600000, preventivo:600000 },
  // Escalas de gauge (configurables; en fase config salen por institución)
  scale:{ oficiales:150, icr:400, derivar:20 },
  // Breakpoints de zona proporcionales (se recalculan sobre cualquier escala)
  zoneBreaks:{ red:0.527, amber:0.66 },  // <52.7% rojo, <66% amber, resto verde
  calendar:{ startHour:6, endHour:22 },
  maxTasks:30,                 // tope de seguridad; lo que no entra pasa en carrusel
  tasksSegPorTarea:4,           // rueda de tareas: segundos por tarea (se ajusta en /config)
  watchdog:{ checkMs:60000, staleFactor:3, hardReloadMs:1800000 } // recarga dura a los 30 min muertos
};

/* =========================================================================
   MOCK DATA — refleja la estructura real (data.json + tickets Zammad).
   Cuando pasemos a mode:'real', estos fetchers apuntan al proxy y el resto
   del dashboard no cambia.
   ========================================================================= */
const MOCK = {
  // Oficiales seleccionados para mostrar (en real: localStorage dashboard_oficiales_sel)
  oficiales:[
    { owner_id:67, nombre:'Elio Molina',        cerrados:112, vencidosHoy:0 },
    { owner_id:66, nombre:'Carlos Carranza',    cerrados:87,  vencidosHoy:2 },
    { owner_id:68, nombre:'Fausto Casco',       cerrados:64,  vencidosHoy:1 },
    { owner_id:64, nombre:'Agustín Gentiletti', cerrados:103, vencidosHoy:0 },
    { owner_id:65, nombre:'Damián Benítez',     cerrados:95,  vencidosHoy:3 }
  ],
  icr:{ nombre:'Ticket total ICR', total:384, vencidosHoy:5 },       // acumulado, escala propia
  derivar:{ nombre:'Tickets a derivar', ref:'Franco Bono', inst:'ICR', count:6 },
  weather:{ tempC:16, cond:'Parcialmente nublado', icon:'⛅', storm:true },
  preventivo:{ proveedores:[
    { nombre:'Texon', total:130, rojo:0, naranja:0, amarillo:0, verde:16, gris:114 },
    { nombre:'Mantenimiento propio', total:24, rojo:2, naranja:3, amarillo:4, verde:15, gris:0 }
  ]},
  // Eventos de calendario (start/end en horas decimales 24h)
  calendar:[
    { day:0, start:8,   end:9.5, title:'Ronda consultorios Oroño', color:'#1976d2' },
    { day:0, start:11,  end:12,  title:'Mantenimiento grupo electrógeno', color:'#7b1fa2' },
    { day:0, start:15,  end:17,  title:'Revisión aires internación', color:'#00897b' },
    { day:1, start:6.5, end:8,   title:'Guardia matutina SP', color:'#c62828' },
    { day:1, start:13,  end:14,  title:'Reunión referentes', color:'#f57c00' },
    { day:2, start:9,   end:11,  title:'Inspección tableros SN', color:'#1976d2' },
    { day:2, start:18,  end:19.5,title:'Corte programado agua', color:'#c62828' },
    { day:3, start:10,  end:12,  title:'Service ascensores DMO', color:'#00897b' }
  ],
  // Tareas (Google Tasks). estado se deriva de la fecha en render.
  tasks:[
    { title:'Cambiar filtros UTA piso 3', due:'today' },
    { title:'Pedir repuestos bomba presurizadora', due:'today' },
    { title:'Firmar remito proveedor gases', due:'overdue' },
    { title:'Actualizar planos red eléctrica', due:'soon' },
    { title:'Calibrar termostatos quirófano', due:'soon' },
    { title:'Revisar luces emergencia ala B', due:'soon' },
    { title:'Cerrar OT #4821', due:'done' },
    { title:'Coordinar visita técnica caldera', due:'soon' }
  ]
};

/* =========================================================================
   CAPA DE DATOS — fetch con timeout (AbortController) + fetchers por fuente.
   ========================================================================= */
async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url,{signal:ctrl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
// ¿esta fuente debe usar datos reales? (modo real global + endpoint ya disponible)
const useReal = name => CONFIG.mode==='real' && CONFIG.live[name];
const delay = ms => new Promise(res=>setTimeout(res,ms)); // latencia simulada en mock
const refQS = (extra='') => `?ref=${encodeURIComponent(CONFIG.ref)}${extra}`; // el proxy usa el perfil del referente

const sources = {
  // Gauges de institución + oficiales. El proxy arma todo desde el perfil del referente.
  async tickets(){
    if(!useReal('tickets')){ await delay(300); return { oficiales:MOCK.oficiales, icr:MOCK.icr }; }
    const d = await fetchWithTimeout(`${CONFIG.proxyBase}/api/tickets${refQS()}`, CONFIG.fetchTimeoutMs);
    return {
      icr:{ nombre:d.institucion.nombre, total:d.institucion.total, vencidosHoy:d.institucion.vencidos_hoy },
      oficiales:(d.oficiales||[]).map(o=>({ owner_id:o.owner_id, nombre:o.nombre, cerrados:o.cerrados, vencidosHoy:o.vencidos_hoy }))
    };
  },
  // Gauge "Tickets a derivar".
  async derivar(){
    if(!useReal('derivar')){ await delay(200); return MOCK.derivar; }
    const d = await fetchWithTimeout(`${CONFIG.proxyBase}/api/derivar${refQS()}`, CONFIG.fetchTimeoutMs);
    return { nombre:'Tickets a derivar', ref:d.referente, inst:d.institucion, count:d.count };
  },
  async calendar(){
    if(!useReal('calendar')){ await delay(250); return MOCK.calendar; }
    return fetchWithTimeout(`${CONFIG.proxyBase}/api/calendario${refQS()}`, CONFIG.fetchTimeoutMs);
  },
  async tasks(){
    if(!useReal('tasks')){ await delay(250); return MOCK.tasks; }
    return fetchWithTimeout(`${CONFIG.proxyBase}/api/tareas${refQS()}`, CONFIG.fetchTimeoutMs);
  },
  async preventivo(){
    if(!useReal('preventivo')){ await delay(200); return MOCK.preventivo; }
    // 30 s: si el proxy del preventivo está despertando, el nuestro igual responde
    // con el último dato guardado; la primera vez del día puede tardar.
    return fetchWithTimeout(`${CONFIG.proxyBase}/api/preventivo${refQS()}`, 30000);
  },
  async weather(){
    if(!useReal('weather')){ await delay(200); return MOCK.weather; }
    return fetchWithTimeout(`${CONFIG.proxyBase}/api/clima${refQS()}`, CONFIG.fetchTimeoutMs);
  }
};

/* =========================================================================
   ROBUSTEZ — poller con backoff + stale-while-error + watchdog central.
   Cada módulo es independiente: si uno falla, no tumba a los demás.
   ========================================================================= */
const registry = {}; // name -> { lastOk, interval, restart, timer, backoff }

function createPoller({ name, intervalMs, fetchFn, renderFn }){
  const state = { lastOk:0, interval:intervalMs, timer:null, backoff:0, lastData:null };
  registry[name] = state;

  async function tick(){
    try{
      const data = await fetchFn();
      state.lastData = data;      // guarda último dato bueno
      state.lastOk = Date.now();
      state.backoff = 0;          // resetea backoff
      renderFn(data);
      schedule(state.interval);   // ritmo normal
    }catch(err){
      console.warn(`[${name}] error:`, err.message);
      // stale-while-error: NO borramos lo que hay en pantalla; reintentamos con backoff
      state.backoff = Math.min(state.backoff ? state.backoff*2 : 30000, 300000); // 30s → 5min techo
      schedule(state.backoff);
    }
    updateHealth();
  }
  function schedule(ms){ clearTimeout(state.timer); state.timer = setTimeout(tick, ms); }
  state.restart = ()=>{ console.info(`[${name}] watchdog restart`); schedule(0); };

  tick(); // primer disparo inmediato
  return state;
}

// Watchdog: vigila que ningún módulo quede congelado
function startWatchdog(){
  setInterval(()=>{
    const now = Date.now();
    let worst = 0;
    for(const [name,s] of Object.entries(registry)){
      const age = now - s.lastOk;
      if(s.lastOk && age > s.interval*CONFIG.watchdog.staleFactor){
        s.restart(); // auto-sanación del módulo
      }
      worst = Math.max(worst, s.lastOk ? age : 0);
    }
    // último recurso: si algo lleva demasiado muerto, recargar toda la página
    if(worst > CONFIG.watchdog.hardReloadMs){
      console.error('watchdog: hard reload'); location.reload();
    }
  }, CONFIG.watchdog.checkMs);
}

/* =========================================================================
   INDICADORES DE FRESCURA Y SALUD
   ========================================================================= */
function fmtAgo(ms){
  const s = Math.floor(ms/1000);
  if(s<60) return 'hace '+s+'s';
  const m = Math.floor(s/60);
  if(m<60) return 'hace '+m+' min';
  return 'hace '+Math.floor(m/60)+' h';
}
function refreshFreshLabels(){
  const now = Date.now();
  [['calendar','fresh-calendar'],['tasks','fresh-tasks'],['preventivo','fresh-preventivo']].forEach(([src,elId])=>{
    const s = registry[src], el = document.getElementById(elId);
    if(!s||!el) return;
    if(!s.lastOk){ el.textContent='—'; return; }
    const age = now - s.lastOk;
    el.textContent = fmtAgo(age);
    el.classList.toggle('stale', age > s.interval*CONFIG.watchdog.staleFactor);
  });
}
function updateHealth(){
  const now = Date.now();
  const dot = document.getElementById('health-dot');
  const txt = document.getElementById('health-text');
  let stale=0, dead=0;
  for(const s of Object.values(registry)){
    if(!s.lastOk){ dead++; continue; }
    if(now - s.lastOk > s.interval*CONFIG.watchdog.staleFactor) stale++;
  }
  if(dead){ dot.className='dot-status err'; txt.textContent='Reintentando conexión…'; }
  else if(stale){ dot.className='dot-status warn'; txt.textContent='Algunos datos desactualizados'; }
  else { dot.className='dot-status'; txt.textContent='Datos al día · modo '+CONFIG.mode; }
}

/* =========================================================================
   GAUGES (SVG) — anillo de referencia por zonas + barra de progreso gruesa.
   ========================================================================= */
const GA = { cx:60, cy:60, r:46, START:135, SWEEP:270 };
function pt(cx,cy,r,deg){ const a=deg*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
function arcPath(cx,cy,r,a0,a1){
  const [x0,y0]=pt(cx,cy,r,a0), [x1,y1]=pt(cx,cy,r,a1);
  const large=(a1-a0)>180?1:0;
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
const valToAngle = (v,scale)=> GA.START + Math.max(0,Math.min(v/scale,1))*GA.SWEEP;

// Zona de un valor. inverted=true → poco es bueno (verde), mucho es malo (rojo).
function zoneColorFor(v,scale,inverted){
  const f = v/scale, b=CONFIG.zoneBreaks;
  if(!inverted){
    if(f < b.red)   return 'var(--zone-red)';
    if(f < b.amber) return 'var(--zone-amber)';
    return 'var(--zone-green)';
  }else{
    if(f < (1-b.amber)) return 'var(--zone-green)';
    if(f < (1-b.red))   return 'var(--zone-amber)';
    return 'var(--zone-red)';
  }
}

// Devuelve el HTML de una card de gauge
let gaugeUid = 0;
function gaugeCardHTML({ value, scale, name, badge, inverted=false, display }){
  const {cx,cy,r,START,SWEEP}=GA;
  const b=CONFIG.zoneBreaks;
  const uid = 'g' + (gaugeUid++);
  const zoneColor = zoneColorFor(value,scale,inverted);
  // Segmentos de referencia (finos). Para inverted, invertimos el orden de colores.
  const stops = inverted
    ? [[0,1-b.amber,'var(--zone-green)'],[1-b.amber,1-b.red,'var(--zone-amber)'],[1-b.red,1,'var(--zone-red)']]
    : [[0,b.red,'var(--zone-red)'],[b.red,b.amber,'var(--zone-amber)'],[b.amber,1,'var(--zone-green)']];
  const refArcs = stops.map(([f0,f1,c])=>{
    const a0=START+f0*SWEEP, a1=START+f1*SWEEP;
    return `<path d="${arcPath(cx,cy,r,a0,a1)}" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="butt" opacity=".55"/>`;
  }).join('');
  // Track gris (barra gruesa de fondo) con leve sombra interior para dar profundidad
  const track = `<path d="${arcPath(cx,cy,r-9,START,START+SWEEP)}" stroke="var(--gauge-track)" stroke-width="11" fill="none" stroke-linecap="round" filter="url(#${uid}-inset)"/>`;
  // Progreso grueso hasta el valor, color de zona con gradiente sutil + brillo superior
  const ang = valToAngle(value,scale);
  const defs = `
    <defs>
      <linearGradient id="${uid}-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${zoneColor}" stop-opacity="1"/>
        <stop offset="100%" stop-color="${zoneColor}" stop-opacity=".78"/>
      </linearGradient>
      <filter id="${uid}-inset" x="-30%" y="-30%" width="160%" height="160%">
        <feComponentTransfer in="SourceAlpha"><feFuncA type="linear" slope="1"/></feComponentTransfer>
        <feGaussianBlur stdDeviation="1.1" result="blur"/>
        <feOffset dx="0" dy=".6" result="off"/>
        <feComposite in="SourceGraphic" in2="off" operator="arithmetic" k2="1" k3="-.35" result="shade"/>
        <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
      </filter>
    </defs>`;
  const prog = value>0
    ? `<path d="${arcPath(cx,cy,r-9,START,ang)}" stroke="url(#${uid}-fill)" stroke-width="11" fill="none" stroke-linecap="round"
         style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.22))"/>
       <circle cx="${pt(cx,cy,r-9,ang)[0].toFixed(2)}" cy="${pt(cx,cy,r-9,ang)[1].toFixed(2)}" r="6.2" fill="${zoneColor}"
         style="filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))"/>
       <circle cx="${pt(cx,cy,r-9,ang)[0].toFixed(2)}" cy="${pt(cx,cy,r-9,ang)[1].toFixed(2)}" r="2.6" fill="rgba(255,255,255,.85)"/>`
    : '';
  const shown = (display!==undefined)?display:value;
  const badgeCls = badge.count>0 ? 'some':'zero';
  const badgeHtml = `<div class="gauge-badge ${badgeCls}"><span>${badge.label}</span><b>${badge.count}</b></div>`;
  return `
    <div class="gauge-card">
      <div class="gauge-wrap">
        <svg class="gauge-svg" viewBox="6 4 108 100">
          ${defs}${track}${refArcs}${prog}
        </svg>
        <div class="gauge-value">${shown}</div>
      </div>
      <div class="gauge-name">${name}</div>
      ${badgeHtml}
    </div>`;
}

/* =========================================================================
   AJUSTE OCULTO DE TICKETS
   El dato real de Zammad nunca se toca: el descuento se aplica recién al
   pintar el gauge. Si el real cambia en el próximo refresco, el mostrado lo
   sigue automáticamente (real 150 con resta 10 → 140; si el real pasa a 153
   → 143). Se guarda en localStorage, por referente.
   ========================================================================= */
// Clave por referente. Es función y no constante porque loadRemoteConfig()
// puede completar CONFIG.ref cuando la URL vino sin ?ref=.
const adjKey = () => 'dashboard_ticket_adj_' + (CONFIG.ref || 'default');
let ADJ = {};   // { owner_id: cantidad_a_restar }

function loadAdjustments(){
  try{
    const raw = localStorage.getItem(adjKey());
    const parsed = raw ? JSON.parse(raw) : {};
    ADJ = {};
    // Sanea: solo claves con enteros finitos. Un localStorage corrupto no debe
    // romper el render de los gauges.
    for(const [k,v] of Object.entries(parsed||{})){
      const n = parseInt(v,10);
      if(Number.isFinite(n) && n!==0) ADJ[k] = n;
    }
  }catch(e){ console.warn('[adj] localStorage ilegible, arranco sin ajustes:', e.message); ADJ = {}; }
}
function saveAdjustments(){
  try{ localStorage.setItem(adjKey(), JSON.stringify(ADJ)); }
  catch(e){ console.warn('[adj] no se pudo guardar:', e.message); }
}
// Valor que se muestra = real − resta, nunca por debajo de 0.
function adjustedCerrados(ownerId, real){
  const off = ADJ[String(ownerId)] || 0;
  return Math.max(0, real - off);
}

/* ---- Panel ---- */
function buildAdjRows(){
  const cont = document.getElementById('adj-rows');
  const t = registry.tickets && registry.tickets.lastData;
  if(!t || !t.oficiales || !t.oficiales.length){
    cont.innerHTML = '<div class="adj-empty">Todavía no llegaron los datos de tickets. Probá de nuevo en unos segundos.</div>';
    return;
  }
  cont.innerHTML = t.oficiales.map(o=>{
    const off = ADJ[String(o.owner_id)] || 0;
    return `<div class="adj-row" data-owner="${o.owner_id}" data-real="${o.cerrados}">
      <span class="adj-name">${o.nombre}</span>
      <span class="adj-real">${o.cerrados}</span>
      <span class="adj-ctl">
        <button data-step="-1" type="button">−</button>
        <input type="number" step="1" value="${off}">
        <button data-step="1" type="button">+</button>
      </span>
      <span class="adj-shown"></span>
    </div>`;
  }).join('');
  cont.querySelectorAll('.adj-row').forEach(row=>{
    const input = row.querySelector('input');
    row.querySelectorAll('button[data-step]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        input.value = (parseInt(input.value,10)||0) + parseInt(btn.dataset.step,10);
        refreshAdjPreview();
      });
    });
    input.addEventListener('input', refreshAdjPreview);
  });
  refreshAdjPreview();
}
// Muestra en vivo cómo quedaría cada gauge antes de guardar.
function refreshAdjPreview(){
  document.querySelectorAll('#adj-rows .adj-row').forEach(row=>{
    const real = parseInt(row.dataset.real,10) || 0;
    const off  = parseInt(row.querySelector('input').value,10) || 0;
    const out  = row.querySelector('.adj-shown');
    out.textContent = Math.max(0, real - off);
    out.classList.toggle('changed', off !== 0);
  });
}
function openAdjPanel(){
  buildAdjRows();
  document.getElementById('adj-msg').classList.remove('on');
  document.getElementById('adj-overlay').classList.add('on');
}
function closeAdjPanel(){ document.getElementById('adj-overlay').classList.remove('on'); }

function applyAdjPanel(){
  const next = {};
  document.querySelectorAll('#adj-rows .adj-row').forEach(row=>{
    const n = parseInt(row.querySelector('input').value,10) || 0;
    if(n !== 0) next[row.dataset.owner] = n;
  });
  // Conserva ajustes de oficiales que hoy no se muestran en este panel.
  for(const [k,v] of Object.entries(ADJ)){
    if(!document.querySelector(`#adj-rows .adj-row[data-owner="${k}"]`)) next[k] = v;
  }
  ADJ = next;
  saveAdjustments();
  renderGauges();                       // impacto inmediato, sin esperar el poller
  const msg = document.getElementById('adj-msg');
  msg.textContent = 'Guardado';
  msg.classList.add('on');
  setTimeout(()=>msg.classList.remove('on'), 1800);
}

/* ---- Gesto secreto: 7 clics en el reloj dentro de 3 segundos ---- */
function initHiddenGesture(){
  const CLICKS_NEEDED = 7, WINDOW_MS = 3000;
  let count = 0, timer = null;
  document.getElementById('clock').addEventListener('click', ()=>{
    count++;
    clearTimeout(timer);
    // Si se corta el ritmo, el contador se reinicia solo: un clic suelto de
    // alguien limpiando la pantalla nunca acumula.
    timer = setTimeout(()=>{ count = 0; }, WINDOW_MS);
    if(count >= CLICKS_NEEDED){
      count = 0; clearTimeout(timer);
      openAdjPanel();
    }
  });
  document.getElementById('adj-close').addEventListener('click', closeAdjPanel);
  document.getElementById('adj-save').addEventListener('click', applyAdjPanel);
  document.getElementById('adj-clear').addEventListener('click', ()=>{
    document.querySelectorAll('#adj-rows .adj-row input').forEach(i=>i.value = 0);
    refreshAdjPreview();
  });
  // Clic fuera del cuadro y tecla Escape también cierran.
  document.getElementById('adj-overlay').addEventListener('click', e=>{
    if(e.target.id === 'adj-overlay') closeAdjPanel();
  });
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape') closeAdjPanel();
  });
}

// Render único de la franja. Orden fijo: Totales → A derivar → Oficiales.
// Ambos pollers (tickets y derivar) llaman acá; cada uno pinta con lo último
// disponible del otro, sin duplicar ni pisarse.
function renderGauges(){
  const cont = document.getElementById('gauges');
  const t = registry.tickets && registry.tickets.lastData;
  const d = registry.derivar && registry.derivar.lastData;
  if(!t && !d) return;
  const cards = [];
  // 1) Ticket totales (acumulado, escala propia configurable)
  if(t){
    cards.push(gaugeCardHTML({
      value:t.icr.total, scale:CONFIG.scale.icr, name:t.icr.nombre,
      badge:{label:'Vencidos hoy', count:t.icr.vencidosHoy}
    }));
  }
  // 2) Tickets a derivar (pocos = bueno → inverted)
  if(d){
    cards.push(gaugeCardHTML({
      value:d.count, scale:CONFIG.scale.derivar,
      name:`${d.nombre}<br><small style="color:var(--text-muted);font-weight:500">${d.ref} · ${d.inst}</small>`,
      badge:{label:'Nuevos', count:d.count}, inverted:true
    }));
  }
  // 3) Oficiales (cantidad dinámica)
  if(t){
    t.oficiales.forEach(o=>{
      // El ajuste oculto se aplica acá, sobre el último real que llegó del proxy.
      const val = adjustedCerrados(o.owner_id, o.cerrados);
      cards.push(gaugeCardHTML({
        value:val, scale:CONFIG.scale.oficiales, name:o.nombre,
        badge:{label:'Vencidos hoy', count:o.vencidosHoy}
      }));
    });
  }
  // Insertar los gauges preservando los botones de controls-inner
  const ctrl = cont.querySelector('#controls-inner');
  cont.innerHTML = cards.join('');
  if(ctrl) cont.insertBefore(ctrl, cont.firstChild);
}

/* =========================================================================
   PREVENTIVO — una barra por proveedor con los cinco estados.
   Los números vienen contados del proxy; acá solo se dibujan.
   ========================================================================= */
const PV_ORDEN = ['rojo','naranja','amarillo','verde','gris'];
const PV_NOMBRE = { rojo:'Vencido', naranja:'≤ 7 días', amarillo:'8 a 14 días', verde:'Al día', gris:'Sin preventivo' };
const pvEsc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderPreventivo(d){
  const el = document.getElementById('prev-list');
  const lista = (d && d.proveedores) || [];
  if(!lista.length){ el.innerHTML = '<div class="pv-vacio">Sin equipos cargados en el preventivo</div>'; return; }
  el.classList.toggle('compacto', lista.length > 3);
  el.innerHTML = lista.map(p=>{
    const seg = PV_ORDEN.map(k=>{
      if(!p[k]) return '';
      const w = 100*p[k]/p.total;
      return `<i class="${k}" style="width:${w}%;background:var(--pv-${k})" title="${PV_NOMBRE[k]}: ${p[k]}">${w>=7?p[k]:''}</i>`;
    }).join('');
    const hechos = p.total - p.gris;
    return `<div class="pv-row">
      <div class="pv-top">
        <span class="pv-nom">${pvEsc(p.nombre)}</span>
        <span class="pv-venc ${p.rojo?'mal':''}"><b>${p.rojo}</b>vencidos</span>
      </div>
      <div class="pv-bar">${seg}</div>
      <div class="pv-sub">${p.total} equipos · ${hechos} con preventivo${p.gris?` · ${p.gris} pendientes`:''}</div>
    </div>`;
  }).join('') +
  `<div class="pv-leyenda">${PV_ORDEN.map(k=>`<span><i style="background:var(--pv-${k})"></i>${PV_NOMBRE[k]}</span>`).join('')}</div>`;
  ajustarPreventivo();
}

/* Si ni en modo compacto entran todos, se ocultan los de abajo (los menos
   comprometidos: vienen ordenados por vencidos) y se avisa cuántos faltan. */
function ajustarPreventivo(){
  const el = document.getElementById('prev-list');
  const viejo = el.querySelector('.pv-mas'); if(viejo) viejo.remove();
  const filas = [...el.querySelectorAll('.pv-row')];
  filas.forEach(f=>{ f.hidden = false; });
  if(el.scrollHeight <= el.clientHeight + 1) return;
  // el aviso ocupa lugar: se agrega antes de medir
  const aviso = document.createElement('div'); aviso.className = 'pv-mas';
  el.insertBefore(aviso, el.querySelector('.pv-leyenda'));
  let ocultas = 0;
  while(el.scrollHeight > el.clientHeight + 1 && ocultas < filas.length - 1){
    filas[filas.length - 1 - ocultas].hidden = true;
    ocultas++;
    aviso.textContent = `+${ocultas} proveedor${ocultas > 1 ? 'es' : ''} más`;
  }
  // van ordenados por vencidos, así que los ocultos no deberían tenerlos; si pasa, se avisa
  const conVenc = filas.filter(f=>f.hidden && f.querySelector('.pv-venc.mal')).length;
  if(conVenc) aviso.textContent += ` (${conVenc} con vencidos)`;
}

function renderWeather(w){
  document.getElementById('wx-temp').textContent = w.tempC+'°';
  document.getElementById('wx-cond').textContent = w.cond;

function renderCalendar(events){
  const grid = document.getElementById('cal-grid');
  const {startHour,endHour} = CONFIG.calendar;
  const hours = endHour - startHour;
  const days = buildDays();
  const pct = h => ((h-startHour)/hours)*100;
  // Gutter de horas: cuerpo absoluto que arranca bajo el header de día (top:2vw)
  let html = '<div class="hour-gutter"><div class="gutter-body">';
  for(let h=startHour; h<=endHour; h++){
    html += `<div class="hour-label" style="top:${pct(h)}%">${String(h).padStart(2,'0')}</div>`;
  }
  html += '</div></div>';
  // Columnas de día
  days.forEach((d,di)=>{
    html += `<div class="day-col">`;
    html += `<div class="day-name ${d.isToday?'today':''}">${d.isToday?'<span class="dot"></span>':''}${d.label}</div>`;
    html += `<div class="events-area">`;
    // líneas de hora (mismo sistema de % que los eventos → alineadas con el gutter)
    for(let h=startHour; h<=endHour; h++){
      html += `<div class="hour-line" style="top:${pct(h)}%"></div>`;
    }
    events.filter(e=>e.day===di).forEach(e=>{
      const s=Math.max(e.start,startHour), en=Math.min(e.end,endHour);
      if(en<=startHour||s>=endHour) return;
      const top=pct(s), hgt=((en-s)/hours)*100;
      const t=`${String(Math.floor(e.start)).padStart(2,'0')}:${String(Math.round((e.start%1)*60)).padStart(2,'0')}`;
      // Alerta "por empezar": solo hoy, solo si faltan <=15 min y todavía no arrancó.
      let soonCls='';
      if(d.isToday){
        const now=new Date(); const hDec=now.getHours()+now.getMinutes()/60;
        const minsToStart=(e.start-hDec)*60;
        if(minsToStart>0 && minsToStart<=15) soonCls=' soon-alert';
      }
      html += `<div class="event${soonCls}" style="top:${top}%;height:${hgt}%;background:${e.color};--ev-color:${e.color}">
                 <span class="ev-time">${t}</span><span class="ev-title">${e.title}</span>${soonCls?'<span class="ev-soon-badge">●</span>':''}</div>`;
    });
    // Línea roja de "ahora" — solo en la columna de hoy y si estamos dentro del rango.
    if(d.isToday){
      const now=new Date(); const hDec=now.getHours()+now.getMinutes()/60;
      if(hDec>=startHour && hDec<=endHour){
        html += `<div class="now-line" style="top:${pct(hDec)}%"><span class="now-dot"></span></div>`;
      }
    }
    html += `</div></div>`;
  });
  grid.innerHTML = html;
}

function renderTasks(tasks){
  const list = document.getElementById('task-list');
  stopAllFires();                 // limpia canvases previos (evita fugas)
  const shown = tasks.slice(0, CONFIG.maxTasks);
  const extra = tasks.length - shown.length;
  const dueLabel = { today:'Vence hoy', overdue:'Vencida', soon:'Próxima', done:'Completada' };
  let html='';
  shown.forEach((t,i)=>{
    const isFire = t.due==='today' || t.due==='overdue';
    const cls = isFire?'fire': t.due==='done'?'done':'soon';
    html += `<div class="task ${cls}" data-fire="${isFire?1:0}">
               <div class="t-title">${t.title}</div>
               <div class="t-due">${dueLabel[t.due]||''}</div></div>`;
  });
  if(extra>0) html += `<div class="more-tag">+${extra} más</div>`;
  list.classList.remove('rueda');
  list.innerHTML = `<div class="task-track">${html}</div>`;
  // enciende fuego en las que vencen hoy (canvas independiente por tarea)
  list.querySelectorAll('.task[data-fire="1"]').forEach(startFire);
  armarRueda(list, html, shown.length);
}

/* =========================================================================
   RUEDA DE TAREAS — si no entran en el espacio que deja Preventivo, la lista
   se repite debajo de sí misma y sube en forma continua. Al terminar una vuelta
   la copia queda exactamente donde estaba la original, así que no hay salto.
   ========================================================================= */
function armarRueda(list, html, n){
  const track = list.firstElementChild;
  const cs = getComputedStyle(list);
  const alto = list.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if(n < 2 || track.scrollHeight <= alto) return;                 // entran todas: quietas
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const originales = track.children.length;
  track.insertAdjacentHTML('beforeend', html);                      // la copia que entra por abajo
  const copias = [...track.children].slice(originales);
  copias.forEach(c=>c.setAttribute('aria-hidden','true'));
  copias.filter(c=>c.dataset.fire==='1').forEach(startFire);
  // distancia de una vuelta: desde la primera tarea hasta su copia (incluye el gap)
  const dist = copias[0].offsetTop - track.children[0].offsetTop;
  track.style.setProperty('--dist', dist + 'px');
  track.style.animationDuration = (n * CONFIG.tasksSegPorTarea) + 's';
  list.classList.add('rueda');
}

/* =========================================================================
   MOTOR DE FUEGO — canvas independiente por tarea, scheduler compartido (perf).
   Cada tarea tiene SU canvas (no se comparte el efecto visual). Un solo rAF
   actualiza todas las instancias para no cargar la TV con N loops.
   ========================================================================= */
const fires = [];
// Paleta con curva gamma: mucho tiempo en negro/rojo oscuro (brasa), sube rápido
// a naranja/amarillo y el blanco queda reservado al núcleo (heat muy alto).
// Eso es lo que hace que una llama se vea "real" en vez de un arcoíris de calor.
const FIRE_PALETTE = (()=>{
  const p=[];
  for(let i=0;i<256;i++){
    const t = i/255;
    const g = Math.pow(t, 1.7); // gamma: comprime los tonos bajos (más negro/rojo, menos banding)
    let r,gr,b;
    if(g<0.20){ // negro → rojo muy oscuro (brasa apagándose)
      const k=g/0.20; r=k*90; gr=0; b=0;
    } else if(g<0.45){ // rojo oscuro → rojo-naranja intenso
      const k=(g-0.20)/0.25; r=90+k*165; gr=k*60; b=0;
    } else if(g<0.72){ // naranja → amarillo
      const k=(g-0.45)/0.27; r=255; gr=60+k*175; b=k*40;
    } else if(g<0.92){ // amarillo → blanco cálido
      const k=(g-0.72)/0.20; r=255; gr=235+k*20; b=40+k*180;
    } else { // núcleo blanco
      r=255; gr=255; b=255;
    }
    p.push([r|0,gr|0,b|0]);
  }
  return p;
})();
// Ruido de "viento" suave por columna (senoidal con fases distintas por fuego,
// para que cada tarea ondule distinto y no todas se muevan al unísono).
function startFire(taskEl){
  const canvas=document.createElement('canvas');
  taskEl.appendChild(canvas);
  // Resolución más alta que antes (÷2.4 en vez de ÷5) → lenguas suaves, no bloques.
  const W=Math.max(46,Math.floor(taskEl.offsetWidth/2.4));
  const H=Math.max(30,Math.floor(taskEl.offsetHeight/2.4));
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false; // el buffer ya es fino; el blur CSS hace el resto
  const img=ctx.createImageData(W,H);
  const heat=new Float32Array(W*H);
  const windPhase=Math.random()*Math.PI*2;
  const windSpeed=0.9+Math.random()*0.6;
  fires.push({el:taskEl,canvas,ctx,img,heat,W,H,windPhase,windSpeed,t0:performance.now()});
}
function stopAllFires(){ fires.length=0; } // canvases se van con innerHTML
let fireRAF=null, fireLastT=0;
const FIRE_FPS=30;
const FIRE_FRAME_MS=1000/FIRE_FPS;
function fireLoop(t){
  fireRAF=requestAnimationFrame(fireLoop);
  if(t - fireLastT < FIRE_FRAME_MS) return;  // throttle
  fireLastT=t;
  const vista = document.getElementById('task-list').getBoundingClientRect();
  for(const f of fires){
    const r = f.el.getBoundingClientRect();
    if(r.bottom < vista.top || r.top > vista.bottom) continue;   // fuera de la rueda: no se dibuja
    const {W,H,heat,img,ctx}=f;
    const age=(t-f.t0)/1000;
    const wind = Math.sin(age*f.windSpeed + f.windPhase) * 1.3
               + Math.sin(age*f.windSpeed*2.3 + f.windPhase*1.7) * 0.6; // dos armónicos → viento no-repetitivo

    // Sembrar fila inferior con ruido irregular: 2-3 ondas de distinta frecuencia
    // desfasadas + aleatoriedad por celda, en vez de un seno único (que se ve como
    // un peine perfecto). El resultado son mechones de ancho y espacio desiguales,
    // como llamas reales, no una reja.
    for(let x=0;x<W;x++){
      const n = Math.sin(x*0.55 + age*2.6)*0.5
              + Math.sin(x*1.7  - age*1.9 + f.windPhase)*0.3
              + Math.sin(x*3.1  + age*4.1)*0.2
              + (Math.random()-0.5)*0.6;
      if(n > 0.05){
        heat[(H-1)*W+x] = 225 + Math.random()*30;
      } else {
        heat[(H-1)*W+x] = 8 + Math.random()*20;
      }
    }

    // Propagar hacia arriba con sesgo vertical + deriva lateral (viento) + turbulencia.
    // Decaimiento fuerte y creciente con la altura: la llama vive en el tercio
    // inferior y se apaga a humo tenue antes de llegar arriba, como el fuego real.
    for(let y=0;y<H-1;y++){
      const rowT = 1 - y/H; // 1 = base, 0 = tope
      const decay = 2.6 + (1-rowT)*4.2;      // más pérdida de calor cuanto más alto
      for(let x=0;x<W;x++){
        const drift = wind*(1-rowT)*1.1;     // el viento dobla más las puntas que la base
        const xl = Math.max(0, Math.min(W-1, Math.round(x-1+drift)));
        const xr = Math.max(0, Math.min(W-1, Math.round(x+1+drift)));
        const xc = Math.max(0, Math.min(W-1, Math.round(x+drift*0.5)));
        const l=heat[(y+1)*W + xl], rr=heat[(y+1)*W + xr], c=heat[(y+1)*W + xc];
        const d=heat[Math.min(y+2,H-1)*W+x];
        const turbulence=(Math.random()-0.5)*4.2*(1-rowT);
        let v=(l + rr + c*3 + d*1.4)/6.4 - (decay+Math.random()*2.2) + turbulence;
        heat[y*W+x]=v<0?0:(v>255?255:v);
      }
    }

    // Pintar con alpha no-lineal: la base queda opaca y sólida, la punta se
    // desvanece a humo transparente en vez de cortar en seco contra el borde.
    const data=img.data;
    for(let i=0;i<heat.length;i++){
      const v=heat[i]|0;
      const [rc,gc,bc]=FIRE_PALETTE[v];
      const alpha = Math.min(255, Math.pow(v/255,1.6)*430);
      const o=i*4; data[o]=rc; data[o+1]=gc; data[o+2]=bc; data[o+3]=alpha;
    }
    ctx.putImageData(img,0,0);
  }
}
// pausa el fuego si la pestaña no está visible (ahorra CPU en la TV)
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ cancelAnimationFrame(fireRAF); fireRAF=null; }
  else if(!fireRAF){ fireRAF=requestAnimationFrame(fireLoop); }
});

function buildDays(){

/* =========================================================================
   CONFIG REMOTA — trae la selección/escala/calendario desde el proxy (/api/config)
   ========================================================================= */
async function loadRemoteConfig(){
  if(CONFIG.mode!=='real') return;                 // en mock usamos los valores locales
  try{
    const c = await fetchWithTimeout(`${CONFIG.proxyBase}/api/config?ref=${encodeURIComponent(CONFIG.ref)}`, CONFIG.fetchTimeoutMs);
    if(c.ref) CONFIG.ref = c.ref;                   // si no venía ref, el proxy devolvió el default
    if(c.selection){
      const s = c.selection;
      if(s.escala_institucion) CONFIG.scale.icr = s.escala_institucion;
      if(s.escala_oficiales)   CONFIG.scale.oficiales = s.escala_oficiales;
      if(s.escala_derivar)     CONFIG.scale.derivar = s.escala_derivar;
      const seg = Number(s.tareas_seg_por_tarea);
      if(Number.isFinite(seg)) CONFIG.tasksSegPorTarea = Math.min(20, Math.max(2, seg));
    }
    if(c.calendar){
      if(typeof c.calendar.startHour==='number') CONFIG.calendar.startHour = c.calendar.startHour;
      if(typeof c.calendar.endHour==='number')   CONFIG.calendar.endHour = c.calendar.endHour;
    }
    // Encender módulos reales según lo que ya esté configurado para ESTE referente.
    if(c.flags){
      CONFIG.live.weather  = !!c.flags.openweather_key_set;
      CONFIG.live.calendar = !!c.flags.google_connected;
      CONFIG.live.tasks    = !!c.flags.google_connected;
    }
  }catch(e){ console.warn('[config] no se pudo cargar config remota, uso valores locales:', e.message); }
}

/* =========================================================================
   ARRANQUE
   ========================================================================= */
async function boot(){
  initTheme();
  tickClock(); setInterval(tickClock,1000);

  await loadRemoteConfig();   // primero la config, después arrancan los pollers
  loadAdjustments();          // depende de CONFIG.ref, va después de la config remota
  initHiddenGesture();

  createPoller({ name:'weather',  intervalMs:CONFIG.intervals.weather,  fetchFn:sources.weather,  renderFn:renderWeather });
  createPoller({ name:'calendar', intervalMs:CONFIG.intervals.calendar, fetchFn:sources.calendar, renderFn:renderCalendar });
  createPoller({ name:'tasks',    intervalMs:CONFIG.intervals.tasks,    fetchFn:sources.tasks,    renderFn:renderTasks });
  createPoller({ name:'tickets',  intervalMs:CONFIG.intervals.tickets,  fetchFn:sources.tickets,  renderFn:renderGauges });
  createPoller({ name:'derivar',  intervalMs:CONFIG.intervals.derivar,  fetchFn:sources.derivar,  renderFn:renderGauges });
  createPoller({ name:'preventivo', intervalMs:CONFIG.intervals.preventivo, fetchFn:sources.preventivo, renderFn:renderPreventivo });

  fireRAF=requestAnimationFrame(fireLoop);
  startWatchdog();
  setInterval(refreshFreshLabels,10000);
  setInterval(updateHealth,5000);
  // Redibuja el calendario cada minuto con el último dato cacheado, para que la
  // línea roja de "ahora" avance sin pedir de nuevo a la API.
  setInterval(()=>{ if(registry.calendar && registry.calendar.lastData) renderCalendar(registry.calendar.lastData); }, 60000);

  document.getElementById('config-btn').addEventListener('click',()=>{
    // Navegación en la MISMA pestaña: funciona en Chrome kiosk (a diferencia de _blank).
    // El botón "Volver" de /config regresa al dashboard.
    window.location.href = `${CONFIG.proxyBase}/config?ref=${encodeURIComponent(CONFIG.ref)}`;
  });
  // Si cambia el alto de la columna (p. ej. Preventivo sumó un proveedor), se
  // rearman las páginas del carrusel y el recorte de Preventivo.
  if('ResizeObserver' in window){
    let ro, altoPrevio = 0;
    new ResizeObserver(([e])=>{
      const h = Math.round(e.contentRect.height);
      if(h === altoPrevio) return; altoPrevio = h;
      clearTimeout(ro); ro=setTimeout(()=>{
        if(registry.tasks && registry.tasks.lastData) renderTasks(registry.tasks.lastData);
      },300);
    }).observe(document.getElementById('tasks'));
  }
  // re-render responsivo del fuego al cambiar tamaño (raro en TV fija, pero prolijo)
  let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{
    if(registry.preventivo&&registry.preventivo.lastData) ajustarPreventivo();
    if(registry.tasks&&registry.tasks.lastData) renderTasks(registry.tasks.lastData);
  },400); });
}
boot();
</script>
